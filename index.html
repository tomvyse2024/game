
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINGALAR - Myanmar Mystery Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #17101f;
  color: white;
  font-family: 'Noto Sans Myanmar', sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  color: #ffd36a;
  font-weight: bold;
}

.main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
  align-items: center;
  min-height: 85vh;
}

.character {
  height: 650px;
  overflow: hidden;
  border-radius: 25px;
}

.character img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.panel {
  background: #ffffff12;
  padding: 28px;
  border-radius: 25px;
}

h1 { color: #ffd36a; }

.speech {
  background: white;
  color: #321b3b;
  padding: 20px;
  border-radius: 20px;
  line-height: 2;
  margin: 20px 0;
}

button {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: none;
  border-radius: 15px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.start { background: #ffbd42; color: #321b3b; }
.choice { background: #55408d; color: white; }
.voice { background: #e86ab5; color: white; }

.hidden { display: none; }

@media(max-width:700px) {
  .main { grid-template-columns: 1fr; }
  .character { height: 400px; }
}
</style>
</head>

<body>
<div class="container">

<header class="header">
  <div>✦ MINGALAR</div>
  <div>LEVEL 01 | ⭐ <span id="score">0</span></div>
</header>

<div class="main">

<div class="character">
  <img src="assets/mm-girl.jpg" alt="မမလေး">
</div>

<div class="panel">

<section id="welcome">
  <h1>မင်္ဂလာပါရှင့် 💗</h1>

  <div class="speech">
    <b>မမလေး</b>
    <p>
      မင်္ဂလာပါရှင့်။ ကျွန်မနာမည် မမလေးပါ။
      ဒီနေ့ စိတ်ဝင်စားစရာ လျှို့ဝှက်ချက်လေးတစ်ခု
      အတူတူရှာကြည့်ကြမလားရှင့်။
    </p>
  </div>

  <button class="voice" onclick="speak('မင်္ဂလာပါရှင့်။ ကျွန်မနာမည် မမလေးပါ။')">
    🔊 အသံနားထောင်မယ်
  </button>

  <button class="start" onclick="startGame()">
    စတင်စူးစမ်းမယ် →
  </button>
</section>

<section id="game" class="hidden">
  <h1 id="title">အိမ်ဟောင်းရဲ့ လျှို့ဝှက်ချက်</h1>

  <div class="speech">
    <p id="story"></p>
    <b>မမလေး</b>
    <p id="dialogue"></p>
  </div>

  <div id="choices"></div>

  <p>🔎 တွေ့ရှိထားသော သဲလွန်စ: <span id="clues">0</span></p>
</section>

<section id="ending" class="hidden">
  <h1>ဂုဏ်ယူပါတယ်ရှင့်! 🎉</h1>
  <p>လျှို့ဝှက်ချက်ကို ဖြေရှင်းနိုင်ခဲ့ပါပြီ။</p>
  <button class="start" onclick="location.reload()">
    နောက်တစ်ခေါက် ကစားမယ်
  </button>
</section>

</div>
</div>
</div>

<script>
function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('ဒီ Browser မှာ အသံစနစ်မရနိုင်ပါ။');
    return;
  }

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = 'my-MM';
  voice.rate = 0.9;
  voice.pitch = 1.1;

  const voices = speechSynthesis.getVoices();
  const burmese = voices.find(v =>
    v.lang.toLowerCase().startsWith('my')
  );

  if (burmese) voice.voice = burmese;

  speechSynthesis.speak(voice);
}

let score = 0;
let step = 0;
let clues = 0;

const missions = [
  {
    title: 'အိမ်ဟောင်းရဲ့ တံခါး',
    story: 'ဒီအိမ်ဟောင်းထဲမှာ လျှို့ဝှက်ချက်တစ်ခု ရှိနေတယ်။',
    dialogue: 'ဘယ်နေရာကို အရင်စစ်ကြည့်မလဲရှင့်။',
    choices: [
      ['ပန်းအိုးအောက်ကို ကြည့်မယ်', 'သော့လေးတစ်ချောင်း တွေ့ပြီရှင့်။', true],
      ['တံခါးကို အတင်းဖွင့်မယ်', 'တံခါးက ဖွင့်မရသေးဘူးရှင့်။', false]
    ]
  },
  {
    title: 'စာကြည့်ခန်း',
    story: 'အိမ်ထဲမှာ စာအုပ်တစ်အုပ် တွေ့ရတယ်။',
    dialogue: 'စာအုပ်ထဲမှာ ဘာရှိမလဲရှင့်။',
    choices: [
      ['စာအုပ်ကို ဖတ်မယ်', 'လမင်းပုံရှိတဲ့နေရာမှာ အဖြေရှိတယ်။', true],
      ['ပြတင်းပေါက်ကို ကြည့်မယ်', 'ဘာမှမတွေ့သေးဘူးရှင့်။', false]
    ]
  },
  {
    title: 'နောက်ဆုံး ပဟေဠိ',
    story: 'သေတ္တာတစ်လုံးပေါ်မှာ နံပါတ်သုံးလုံး ထည့်ဖို့နေရာရှိတယ်။',
    dialogue: 'အဖြေက 2 - 4 - 8 ဖြစ်မယ်ထင်တယ်ရှင့်။',
    choices: [
      ['2 - 4 - 8', 'မှန်သွားပြီရှင့်။ သေတ္တာပွင့်သွားပြီ။', true],
      ['4 - 2 - 8', 'မမှန်သေးဘူးရှင့်။ ထပ်စဉ်းစားပါ။', false]
    ]
  }
];

function startGame() {
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');

  showMission();
  speak('စလိုက်ကြရအောင်ရှင့်။');
}

function showMission() {
  const m = missions[step];

  document.getElementById('title').textContent = m.title;
  document.getElementById('story').textContent = m.story;
  document.getElementById('dialogue').textContent = m.dialogue;

  const area = document.getElementById('choices');
  area.innerHTML = '';

  m.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c[0];

    btn.onclick = () => selectChoice(c);

    area.appendChild(btn);
  });
}

function selectChoice(c) {
  document.getElementById('dialogue').textContent = c[1];

  speak(c[1]);

  if (!c[2]) return;

  clues++;
  score += 100;

  document.getElementById('score').textContent = score;
  document.getElementById('clues').textContent = clues;

  setTimeout(() => {
    step++;

    if (step >= missions.length) {
      document.getElementById('game').classList.add('hidden');
      document.getElementById('ending').classList.remove('hidden');
      speak('ဂုဏ်ယူပါတယ်ရှင့်။ လျှို့ဝှက်ချက်ကို ဖြေရှင်းနိုင်ခဲ့ပြီ။');
    } else {
      showMission();
    }
  }, 1200);
}

window.addEventListener('load', () => {
  setTimeout(() => {
    speak('မင်္ဂလာပါရှင့်။ ကျွန်မနာမည် လီဆာပါ။');
  }, 800);
});
</script>

</body>
</html>

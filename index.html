
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080b16">
  <title>SHADOW NINJA V4</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Three.js module resolver -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <h1>SHADOW NINJA</h1>
    <p id="loadingText">LOADING SHADOW WORLD...</p>
  </div>

  <div id="errorBox" class="hidden">
    <h2>WORLD FAILED TO LOAD</h2>
    <p id="errorText"></p>
    <button onclick="location.reload()">TRY AGAIN</button>
  </div>

  <div id="menu" class="panel hidden">
    <div class="logo">SHADOW <span>NINJA</span></div>
    <p class="subtitle">REALISTIC ANIME 3D · V4</p>
    <p class="intro">A new warrior. A dangerous world. One final mission.</p>
    <div class="stage-choice">
      <button class="stage active" data-stage="forest">🌙 Moonlit Forest</button>
      <button class="stage" data-stage="ice">❄️ Frozen Temple</button>
      <button class="stage" data-stage="lava">🔥 Lava Fortress</button>
    </div>
    <button id="enterBtn" class="primary">ENTER THE SHADOW WORLD</button>
    <p class="help">WASD / Joystick · Mouse drag to rotate camera</p>
  </div>

  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="hud-card">
        <span>❤️ HEALTH</span>
        <div class="health-track"><div id="healthBar"></div></div>
      </div>
      <div class="hud-card boss-card">
        <span id="bossName">FOREST DEMON</span>
        <div class="health-track boss-track"><div id="bossBar"></div></div>
      </div>
      <button id="pauseBtn">Ⅱ</button>
    </div>
    <div id="message">DEFEAT THE DEMON</div>
    <div class="bottom-controls">
      <div id="joystick">
        <div id="stick"></div>
      </div>
      <div class="action-buttons">
        <button id="jumpBtn">JUMP</button>
        <button id="attackBtn">⚔ ATTACK</button>
      </div>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <h1 id="resultTitle">VICTORY</h1>
    <p id="resultMessage">The shadow world is safe.</p>
    <button id="againBtn" class="primary">PLAY AGAIN</button>
    <button id="homeBtn" class="secondary">MAIN MENU</button>
  </div>

  <div id="pausePanel" class="panel hidden">
    <h1>PAUSED</h1>
    <button id="resumeBtn" class="primary">RESUME</button>
    <button id="quitBtn" class="secondary">MAIN MENU</button>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>

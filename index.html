
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090817">
  <title>SHADOW NINJA V4 - 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">LOADING SHADOW WORLD...</div>

  <div id="game">
    <div id="menu" class="panel">
      <div class="logo">SHADOW <span>NINJA</span></div>
      <div class="version">REALISTIC ANIME 3D · V4</div>
      <p class="intro">A new warrior. A dangerous world. One final mission.</p>
      <div class="stage-select">
        <button class="stage active" data-stage="0">🌙 Moonlit Forest</button>
        <button class="stage" data-stage="1">❄️ Frozen Temple</button>
        <button class="stage" data-stage="2">🔥 Lava Fortress</button>
      </div>
      <button id="start" class="primary">ENTER THE SHADOW WORLD</button>
      <p class="tip">WASD / Joystick · Mouse drag to rotate camera</p>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-card">❤️ <b id="health">100</b></div>
        <div class="hud-card">🪙 <b id="coins">0</b></div>
        <div class="hud-card">⚔️ <b id="stageName">MOONLIT FOREST</b></div>
        <button id="pause" class="hud-card">Ⅱ</button>
      </div>
      <div id="bossPanel">
        <div id="bossName">FOREST DEMON</div>
        <div class="bar"><div id="bossHealth"></div></div>
      </div>
      <div id="message"></div>
    </div>

    <div id="mobileControls" class="hidden">
      <div id="joystick"><div id="stick"></div></div>
      <div class="actions">
        <button id="jump">JUMP</button>
        <button id="attack">ATTACK</button>
      </div>
    </div>

    <div id="pausePanel" class="panel hidden">
      <h1>PAUSED</h1>
      <button id="resume" class="primary">RESUME</button>
      <button id="home" class="secondary">MAIN MENU</button>
    </div>

    <div id="resultPanel" class="panel hidden">
      <h1 id="resultTitle">VICTORY</h1>
      <p id="resultText"></p>
      <button id="retry" class="primary">PLAY AGAIN</button>
      <button id="resultHome" class="secondary">MAIN MENU</button>
    </div>

    <div id="help">Drag to look around · WASD to move · Space to jump · J to attack</div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
